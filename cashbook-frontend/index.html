<!DOCTYPE html> 
<html lang="my" class="dark not-authed"> 

<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yogi App</title>

  <!-- PWA Web App Manifest & Theme Config -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yogi အစီအစဥ်">

  <script>
    (function () {
      var token = localStorage.getItem('yogi_auth_token');
      var expiresAt = Number(localStorage.getItem('yogi_token_expires_at') || 0);
      var valid = token && expiresAt && Date.now() < expiresAt;
      document.documentElement.className = valid ? 'dark is-authed' : 'dark not-authed';
    })();
  </script>

  <!-- App Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-192.png">
  
  <!-- Tailwind Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 6.7.2 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Excel library -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .fa, .fas, .far, .fal, .fab, .fa-solid, .fa-regular, .fa-brands {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
      display: inline-block;
      font-style: normal;
      font-variant: normal;
      text-rendering: auto;
      line-height: 1;
    }

    html.is-authed #login-overlay { display: none !important; }
    html.is-authed #erp-workspace { display: flex !important; }
    html.not-authed #login-overlay { display: flex !important; }
    html.not-authed #erp-workspace { display: none !important; }

    /* စာသားမရှိသေးပါက Login Error Bar အပိုကြီး မပေါ်စေရန် */
    #login-error:empty {
      display: none !important;
    }

    /* 💡 Header ရက်စွဲအချိန် မပျောက်စေရန် သီးသန့် CSS */
    .header-datetime {
      display: inline-block !important;
      color: #fde68a !important;
      font-weight: 800 !important;
    }

    .header-datetime-divider {
      display: inline-block !important;
      color: rgba(245, 158, 11, 0.4) !important;
      font-weight: 900 !important;
    }

    /* ဖုန်းမျက်နှာပြင် အလွန်သေးချိန် (< 600px) မှသာ ခေါင်းစဉ်မကျဉ်းစေရန် ရက်စွဲကို ခေတ္တဝှက်မည် */
    @media (max-width: 600px) {
      .header-datetime,
      .header-datetime-divider {
        display: none !important;
      }
    }

    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button, a, [role="button"] {
      user-select: none;
      -webkit-user-select: none;
    }

    header {
      padding-top: max(env(safe-area-inset-top), 0.5rem);
    }
  </style>
</head>

<body class="bg-[#090d16] font-sans flex h-screen w-screen overflow-hidden text-slate-300 select-none">

  <!-- Login Overlay -->
  <div id="login-overlay" class="fixed inset-0 bg-[#070a12]/95 backdrop-blur-md z-[100] flex items-center justify-center p-4">
    <div class="login-card-box relative space-y-6 w-full max-w-sm mx-auto">
      <div class="text-center relative z-10">
        <div class="inline-flex items-center justify-center p-4 rounded-2xl bg-gradient-to-b from-amber-500/20 to-amber-600/10 border border-amber-500/40 shadow-lg shadow-amber-500/10 mb-3">
          <i class="fa-solid fa-dharmachakra text-4xl text-amber-400 filter drop-shadow-[0_0_12px_rgba(245,158,11,0.6)]"></i>
        </div>
        <h2 class="text-2xl font-black tracking-tight mb-1 bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 bg-clip-text text-transparent">Zoom ပဋ္ဌာန်း မိသားစု</h2>
        <p class="text-[11px] font-extrabold uppercase tracking-[0.25em] text-amber-300/80 pb-3 border-b border-amber-500/20">တရားဆွေးနွေးပွဲ · ယောဂီများ စီမံခန့်ခွဲမှု</p>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs text-left relative z-10">
        <div>
          <label class="block font-bold text-[11px] text-amber-200/90 uppercase tracking-widest mb-1.5">Select Role / User</label>
          <select id="login-username" required
            class="w-full p-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-xs text-slate-100 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/25 transition font-bold cursor-pointer">
          </select>
        </div>
        <div>
          <label class="block font-bold text-[11px] text-amber-200/90 uppercase tracking-widest mb-1.5">Password</label>
          <input type="password" id="login-password" required placeholder="လျှို့ဝှက်နံပါတ် ရိုက်ထည့်ပါ..."
            class="w-full p-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-xs text-slate-100 placeholder:text-slate-600 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/25 transition">
        </div>
        
        <div id="login-error" style="display: none;" class="hidden text-rose-400 font-semibold text-[11px] bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-xl text-center"></div>
        
        <button type="submit"
          class="w-full py-3.5 mt-2 bg-gradient-to-r from-amber-500 via-amber-600 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black rounded-xl transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 text-xs tracking-wider active:scale-[0.99] cursor-pointer">
          <span>စနစ်အတွင်းသို့ ဝင်မည်</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500 relative z-10">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
          <span class="font-bold text-slate-400">System Ready</span>
        </div>
        <span class="font-mono text-amber-400/80 font-extrabold">v1.0</span>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <div id="erp-workspace" class="hidden h-screen w-screen flex flex-row overflow-hidden bg-[#090d16] relative">
    
    <!-- Mobile & Tablet Backdrop Overlay -->
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar(true)" style="display: none;"
         class="fixed inset-0 bg-black/75 backdrop-blur-sm cursor-pointer transition-opacity z-[9998]"></div>

    <!-- Left Sidebar Drawer -->
    <aside id="main-sidebar" class="bg-[#0c1220] border-r border-amber-500/20 flex flex-col h-full shrink-0">
      <div class="h-[64px] px-4 border-b border-amber-500/20 flex items-center justify-between bg-[#0e172a] shrink-0">
        <div class="flex items-center gap-2.5 font-black text-sm text-amber-400 min-w-0 overflow-hidden">
          <i class="fa-solid fa-dharmachakra text-amber-400 text-lg shrink-0 filter drop-shadow-[0_0_6px_rgba(245,158,11,0.5)]"></i>
          <span class="truncate font-extrabold whitespace-nowrap tracking-wide">Zoom ယောဂီစာရင်း</span>
        </div>
        
        <div class="flex items-center gap-1">
          <button onclick="toggleMobileSidebar(true)" class="xl:hidden text-slate-400 hover:text-white p-2 rounded-lg cursor-pointer" title="Close Sidebar">
            <i class="fa-solid fa-xmark text-lg text-slate-300"></i>
          </button>
          <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 transition p-2 rounded-lg shrink-0 hover:bg-slate-800/60 cursor-pointer" title="Logout">
            <i class="fa-solid fa-power-off text-sm"></i>
          </button>
        </div>
      </div>
      <nav class="flex-1 px-3 py-3 space-y-1.5 overflow-y-auto" id="sidebar-nav"></nav>
    </aside>

    <!-- Right Content Area -->
    <div id="main-content-area" class="flex-1 flex flex-col h-full min-w-0 overflow-hidden bg-[#090d16] w-full">
      
      <!-- Top Navigation Header -->
      <header class="h-[64px] bg-[#0c1220] border-b border-amber-500/20 px-3 sm:px-6 flex items-center justify-between shrink-0 z-30 gap-2">
        <div class="flex items-center gap-3 min-w-0">
          <button id="mobile-menu-btn" onclick="toggleMobileSidebar()" 
            class="flex items-center justify-center w-11 h-11 rounded-xl bg-amber-500/20 border border-amber-400/40 text-amber-400 active:scale-95 transition shadow-lg shrink-0 cursor-pointer" 
            title="Open Menu">
            <i class="fa-solid fa-bars text-lg text-amber-300"></i>
          </button>
          <h1 id="page-title" class="text-base sm:text-lg font-black text-amber-300/90 truncate tracking-wide">ပင်မစာမျက်နှာ</h1>
        </div>

        <!-- 💡 အသစ်ပြင်ဆင်ထားသော Header Right Badge: [WiFi/Offline] | [ရက်စွဲ | နေ့ | အချိန်] | [Admin] -->
        <div style="display: inline-flex; align-items: center; gap: 0.65rem; padding: 0.35rem 0.85rem; background-color: #070d18; border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 0.75rem; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 0.75rem; font-weight: 800; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); white-space: nowrap;">
          
          <!-- ၁။ WiFi (Online) / Offline Status -->
          <span id="header-network-status" style="display: inline-flex; align-items: center; gap: 0.35rem; color: #34d399;">
            <i class="fa-solid fa-wifi" style="font-size: 0.8rem;"></i>
            <span>Online</span>
          </span>

          <span class="header-datetime-divider">|</span>

          <!-- ၂။ Live ရက်စွဲနှင့် အချိန် နာရီ (ဥပမာ: 16 Oct 26 | Fri | 8:35 pm) -->
          <span id="header-live-datetime" class="header-datetime">--</span>

          <span style="color: rgba(245, 158, 11, 0.4); font-weight: 900;">|</span>

          <!-- ၃။ User Badge (Admin) -->
          <span style="display: inline-flex; align-items: center; gap: 0.35rem; color: #34d399;">
            <i class="fa-solid fa-user" style="font-size: 0.75rem;"></i>
            <span id="live-user-name">Admin</span>
          </span>
        </div>
      </header>

      <!-- Main Content -->
      <main class="flex-1 p-3 sm:p-6 overflow-y-auto relative bg-[#090d16]">
        <div id="view-container" class="max-w-7xl mx-auto w-full"></div>
      </main>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" style="display: none !important;"
       class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[250] flex flex-col items-center justify-center">
    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-amber-400 mb-3"></div>
    <p class="text-xs font-bold text-amber-200 tracking-wide">ဆောင်ရွက်နေပါသည် ခဏစောင့်ပါ...</p>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[300] flex flex-col gap-2 pointer-events-none"></div>

  <!-- JavaScript Controls -->
  <script>
    // Loading Overlay Helper
    window.toggleLoading = function(show) {
      const el = document.getElementById('loading-overlay');
      if (!el) return;
      if (show) {
        el.style.setProperty('display', 'flex', 'important');
      } else {
        el.style.setProperty('display', 'none', 'important');
      }
    };
    window.showLoading = () => window.toggleLoading(true);
    window.hideLoading = () => window.toggleLoading(false);

    // Safety Guard: 4 စက္ကန့်အကြာတွင် Loading ပိတ်ပေးခြင်း
    window.addEventListener('load', () => {
      setTimeout(() => {
        window.hideLoading();
      }, 4000);
    });

    // Mobile Sidebar အဖွင့်/အပိတ်
    window.toggleMobileSidebar = function(forceClose = false) {
      const sidebar = document.getElementById('main-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (!sidebar) return;

      const isOpen = sidebar.classList.contains('sidebar-open') || sidebar.classList.contains('translate-x-0');

      if (forceClose || isOpen) {
        sidebar.classList.remove('sidebar-open', 'translate-x-0');
        sidebar.classList.add('-translate-x-full');
        if (backdrop) backdrop.style.setProperty('display', 'none', 'important');
      } else {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('sidebar-open', 'translate-x-0');
        if (backdrop) backdrop.style.setProperty('display', 'block', 'important');
      }
    };

    // 💡 အင်တာနက် အခြေအနေ (Online / Offline) စစ်ဆေးပေးသည့် Function
    function updateNetworkStatus() {
      const el = document.getElementById('header-network-status');
      if (!el) return;

      if (navigator.onLine) {
        el.style.color = "#34d399";
        el.innerHTML = `<i class="fa-solid fa-wifi" style="font-size: 0.8rem;"></i> <span>Online</span>`;
      } else {
        el.style.color = "#f87171";
        el.innerHTML = `<i class="fa-solid fa-plane-slash" style="font-size: 0.8rem;"></i> <span>Offline</span>`;
      }
    }

    // 💡 ရက်စွဲနှင့် အချိန်ပြသခြင်း: 16 Oct 26 | Fri | 8:35 pm
    function startHeaderClock() {
      function updateClock() {
        const datetimeEl = document.getElementById('header-live-datetime');
        if (!datetimeEl) return;
        
        const now = new Date();
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const dateNum = String(now.getDate()).padStart(2, '0');
        const monthName = months[now.getMonth()];
        const yearShort = String(now.getFullYear()).slice(-2);
        const dayName = days[now.getDay()];

        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours ? hours : 12;

        // 💡 တောင်းဆိုထားသည့် ပုံစံ: 16 Oct 26 | Fri | 8:35 pm
        datetimeEl.textContent = `${dateNum} ${monthName} ${yearShort} | ${dayName} | ${hours}:${minutes} ${ampm}`;
      }

      updateClock();
      setInterval(updateClock, 1000);
    }

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          console.log('PWA ServiceWorker registered successfully:', reg.scope);
        }).catch(function(err) {
          console.log('PWA ServiceWorker registration failed:', err);
        });
      });
    }

    // စတင်ချိန်တွင် ချက်ချင်း Run ခြင်း
    startHeaderClock();
    updateNetworkStatus();

    document.addEventListener('DOMContentLoaded', () => {
      startHeaderClock();
      updateNetworkStatus();

      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      
      const nav = document.getElementById('sidebar-nav');
      if (nav) {
        nav.addEventListener('click', (e) => {
          if (window.innerWidth < 1280 && (e.target.closest('a') || e.target.closest('button'))) {
            window.toggleMobileSidebar(true);
          }
        });
      }
    });
  </script>

  <!-- Script Inclusions -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/leaders.js"></script>
  <script src="js/yogi.js"></script>
  <script src="js/yogi-summary.js"></script>
  <script src="js/cashbook.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
